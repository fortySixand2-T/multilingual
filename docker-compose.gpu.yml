# NVIDIA GPU passthrough for Ollama and Whisper STT. Requires the NVIDIA Container
# Toolkit on the host (see docs/hosting.md). Layer it on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  app:
    # Whisper on the GPU is the biggest speaking-latency lever. int8, not float16:
    # Pascal cards (GTX 10xx) have crippled fp16 but fast int8 (DP4A). whisper-small
    # int8 needs ~0.5–1 GB VRAM next to the resident LLM; if CUDA can't start, the
    # adapter falls back to CPU int8 and logs a warning.
    build:
      args:
        WHISPER_CUDA: "1"
    environment:
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=int8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
