# Task profiles -> providers. Edit THIS file to swap providers; never the code.
# Local-first defaults: cheap drills run on Ollama, with Anthropic as fallback.
# `cache: true` serves identical requests from the app cache (cost/latency win for
# stable, repeated prompts). Leave off for anything that should vary per call.
profiles:
  drill_a1:
    capability: llm
    primary: "ollama/llama3.1"
    fallback: "anthropic/claude-haiku-4-5"

  grammar_explain:
    capability: llm
    primary: "anthropic/claude-sonnet-4-6"
    fallback: "ollama/llama3.1"
    cache: true          # explanations of a fixed grammar point are reusable
    cache_ttl: 86400

  writing_feedback:
    capability: llm
    primary: "anthropic/claude-opus-4-8"
    fallback: "anthropic/claude-sonnet-4-6"

  examiner_roleplay:
    capability: llm
    primary: "anthropic/claude-sonnet-4-6"
