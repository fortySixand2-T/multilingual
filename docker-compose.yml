# Base stack for a self-hosted box (Linux laptop / server): app (FastAPI + built
# SPA) + Ollama for local AI. Storage is the local filesystem on the data volume.
# The app is published on loopback only — expose it with Tailscale (recommended)
# or the Caddy override (public domain). See docs/hosting.md.
#
#   cp .env.example .env        # set JWT_SECRET, INVITE_CODES
#   # NVIDIA GPU box:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   docker compose exec ollama ollama pull llama3.1
#   # then expose it:  sudo tailscale serve --bg 9000
services:
  app:
    build: .
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STORAGE_BACKEND=local
      - DATABASE_URL=sqlite+aiosqlite:///./data/tef.db
      # Speech stack (self-host): STT on CPU int8 (GPU stays free for the resident
      # LLM); TTS via the Piper binary + voice baked into the image.
      - STT_BACKEND=faster-whisper
      - TTS_BACKEND=piper
      - WHISPER_MODEL=small
      - PIPER_VOICE=/app/voices/fr_FR-upmc-medium.onnx
    volumes: ["./data:/app/data"]
    depends_on: [ollama]
    restart: unless-stopped
    # Loopback only; Tailscale (or the Caddy override) is what exposes it.
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    # Pin an older tag on hosts with an NVIDIA driver < 570 (e.g. Pascal / GTX 10xx
    # on driver 550): set OLLAMA_IMAGE_TAG=0.6.8 in .env. Default = latest.
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-latest}
    # Keep the model resident on a dedicated box (-1) so there's no reload lag after
    # idle; default 5m otherwise.
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

volumes:
  ollama:
