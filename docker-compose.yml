# Production stack for a single VPS: app (FastAPI + built SPA) behind Caddy
# (automatic HTTPS), with Ollama for local AI. Storage is the local filesystem on
# the data volume — no MinIO needed at this scale.
#
#   cp .env.example .env    # then set JWT_SECRET, INVITE_CODES, SITE_ADDRESS
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.1
#
# Ollama needs a roomy box (16GB+ RAM, GPU ideal). To run without it, drop the
# ollama service + depends_on and leave AI features to 503 until a key is set.
services:
  app:
    build: .
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STORAGE_BACKEND=local
      - DATABASE_URL=sqlite+aiosqlite:///./data/tef.db
    volumes: ["./data:/app/data"]
    depends_on: [ollama]
    restart: unless-stopped
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on: [app]
    restart: unless-stopped

volumes:
  ollama:
  caddy_data:
  caddy_config:
