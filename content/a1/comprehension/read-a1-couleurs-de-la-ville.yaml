      - "Un ballon blanc"
      - "Une robe rose"
    answer: "Un manteau marron et un sac violet"
    explain: "« Une dame porte un manteau marron et un sac violet. »"
  - id: read-a1-couleurs-de-la-ville.q3
    prompt: "Comment est le ciel le soir ?"
    options:
      - "Bleu foncé"
      - "Bleu clair"
      - "Gris"
