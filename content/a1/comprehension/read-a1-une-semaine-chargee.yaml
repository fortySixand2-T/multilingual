id: read-a1-une-semaine-chargee
level: a1
skill: reading
title: "Une semaine chargée"
time_limit_seconds: 150
pass_threshold: 0.6
passage: |
  Lundi, je laisse mon fils à la garderie. Mardi, j'ai un cours à l'université.
  Mercredi, je vais au salon de coiffure. Jeudi, je fais du sport au gymnase.
  Vendredi, je lave mes vêtements à la buanderie. Samedi, je dois aller à la
  clinique. Avant de partir, je m'arrête à la station-service. Dimanche, les
  enfants jouent au terrain de jeu. En été, nous allons au camping.
questions:
