    explain: "« Mardi, j'ai un cours à l'université. »"
  - id: read-a1-une-semaine-chargee.q2
    prompt: "Que fait-elle le vendredi ?"
    options:
      - "Elle lave ses vêtements à la buanderie"
      - "Elle va au salon de coiffure"
      - "Elle va à la clinique"
    answer: "Elle lave ses vêtements à la buanderie"
    explain: "« Vendredi, je lave mes vêtements à la buanderie. »"
  - id: read-a1-une-semaine-chargee.q3
    prompt: "Où jouent les enfants le dimanche ?"
    options:
      - "Au terrain de jeu"
      - "Au camping"
      - "Au gymnase"
    answer: "Au terrain de jeu"
    explain: "« Dimanche, les enfants jouent au terrain de jeu. »"
