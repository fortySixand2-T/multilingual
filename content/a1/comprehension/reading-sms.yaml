id: read-sms
level: a1
skill: reading
title: "Des messages entre amis"
time_limit_seconds: 120
pass_threshold: 0.6
passage: |
  Léa : Salut ! Tu es libre ce soir ?
  Tom : Oui, après 18 h. Pourquoi ?
  Léa : On va au cinéma avec Marie. Tu viens ?
  Tom : D'accord ! On se retrouve où ?
  Léa : Devant le cinéma à 20 h.
questions:
  - id: read-sms.q1
    prompt: "Où vont-ils ?"
    options: ["Au cinéma", "Au restaurant", "À la gare"]
