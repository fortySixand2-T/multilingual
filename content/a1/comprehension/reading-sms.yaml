    explain: "« On va au cinéma avec Marie. »"
  - id: read-sms.q2
    prompt: "À quelle heure se retrouvent-ils ?"
    options: ["20 h", "18 h", "After Marie"]
    answer: "20 h"
    explain: "« Devant le cinéma à 20 h. »"
  - id: read-sms.q3
    prompt: "Qui vient aussi ?"
    options: [Marie, Léa, Personne]
    answer: Marie
    explain: "« On va au cinéma avec Marie. »"
