    explain: "« nous habitons tous au Canada »."
  - id: read-a1-la-classe-de-francais.q3
    prompt: "Qui arrive la semaine prochaine ?"
    options:
      - "Deux étudiants des États-Unis"
      - "Un étudiant du Japon"
      - "Une étudiante de l'Inde"
    answer: "Deux étudiants des États-Unis"
    explain: "« Deux étudiants arrivent des États-Unis la semaine prochaine. »"
