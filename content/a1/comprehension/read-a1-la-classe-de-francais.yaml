passage: |
  Dans ma classe, nous venons de partout. Amina arrive du Maroc et Sofia, de
  l'Algérie. Karim est né en Tunisie. Awa vient du Sénégal et Marie, d'Haïti. Paulo
  arrive du Brésil et Diego, du Mexique. Wei vient de la Chine, Yuki du Japon et
  Priya de l'Inde. Hans est allemand : il arrive de l'Allemagne. Emma vient de
  l'Angleterre et Luc, de la Belgique. Moi, je viens de la France, et nous habitons
  tous au Canada. Deux étudiants arrivent des États-Unis la semaine prochaine.
questions:
