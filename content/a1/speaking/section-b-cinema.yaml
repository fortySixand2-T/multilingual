id: speak-a1-b-cinema
level: a1
section: B
title: "Convaincre un ami d'aller au cinéma"
prompt: |
  Votre ami préfère rester à la maison ce soir. Convainquez-le d'aller au cinéma
  avec vous. Donnez au moins deux raisons simples.
points:
  - "le film et l'horaire"
  - "le prix du billet"
  - "sortir plutôt que rester seul"
  - "comment y aller"
openers:
  - fr: "Salut ! Ce soir, je veux rester à la maison. Je suis fatigué. Pourquoi tu veux aller au cinéma ?"
    en: "Hi! Tonight I want to stay home. I'm tired. Why do you want to go to the cinema?"
  - fr: "Le cinéma ce soir ? Non, je préfère regarder la télé à la maison. Pourquoi sortir ?"
    en: "The cinema tonight? No, I'd rather watch TV at home. Why go out?"
  - fr: "Salut ! Tu veux aller au cinéma ? Mais c'est cher, et il fait froid dehors. Pourquoi c'est une bonne idée ?"
    en: "Hi! You want to go to the cinema? But it's expensive, and it's cold outside. Why is it a good idea?"
