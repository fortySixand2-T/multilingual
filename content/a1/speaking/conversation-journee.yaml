id: speak-a1-c-journee
level: a1
section: C
title: "Votre journée"
prompt: |
  Racontez une journée normale : le matin, l'après-midi et le soir.
prompt_en: "Talk through an ordinary day: morning, afternoon and evening."
points:
  - "à quelle heure vous vous levez"
  - "ce que vous faites le matin"
  - "votre repas préféré de la journée"
  - "ce que vous faites le soir"
points_en:
  - "Say what time you get up — « je me lève à… »"
  - "Describe your morning in two or three steps"
  - "Say which meal you like best and what you eat"
  - "Say what you do to relax in the evening"
openers:
  - fr: "Bonjour ! Parlons de votre journée. À quelle heure vous vous levez le matin ?"
    en: "Hello! Let's talk about your day. What time do you get up in the morning?"
  - fr: "Bonjour ! Racontez-moi une journée normale. Qu'est-ce que vous faites le matin ?"
    en: "Hello! Tell me about an ordinary day. What do you do in the morning?"
  - fr: "Bonjour ! Je voudrais connaître votre journée. Vous travaillez ou vous étudiez ?"
    en: "Hello! I'd like to hear about your day. Do you work or study?"
  - fr: "Salut ! Une petite question : qu'est-ce que vous mangez le matin ?"
    en: "Hi! A little question: what do you eat in the morning?"
  - fr: "Bonsoir ! Votre journée commence tôt ou tard ?"
    en: "Good evening! Does your day start early or late?"
