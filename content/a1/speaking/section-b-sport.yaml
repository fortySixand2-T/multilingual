id: speak-a1-b-sport
level: a1
section: B
title: "Proposer de faire du sport ensemble"
prompt: |
  Vous voulez faire du sport avec un ami. Il n'a pas envie. Convainquez-le de
  venir avec vous.
points:
  - "le sport et le lieu"
  - "le jour et l'heure"
  - "c'est bon pour la santé"
  - "ce n'est pas cher"
openers:
  - fr: "Le sport ? Non merci, je n'aime pas ça. Pourquoi tu veux que je vienne ?"
    en: "Sport? No thanks, I don't like it. Why do you want me to come?"
  - fr: "Salut ! Faire du sport avec toi ? Je suis trop fatigué. Pourquoi c'est une bonne idée ?"
    en: "Hi! Do sport with you? I'm too tired. Why is it a good idea?"
  - fr: "Ah non, pas le sport ! Je préfère rester sur le canapé. Tu as une bonne raison ?"
    en: "Oh no, not sport! I'd rather stay on the sofa. Do you have a good reason?"
  - fr: "Courir ce week-end ? Mais il pleut, et j'aime dormir le samedi. Pourquoi venir ?"
    en: "Running this weekend? But it's raining, and I like sleeping in on Saturdays. Why come?"
  - fr: "Salut ! Le sport, ce n'est pas pour moi. Qu'est-ce que tu me proposes ?"
    en: "Hi! Sport isn't for me. What are you suggesting?"
