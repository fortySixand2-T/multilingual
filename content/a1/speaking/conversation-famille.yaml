id: speak-a1-c-famille
level: a1
section: C
title: "Parler de votre famille"
prompt: |
  Décrivez votre famille : qui sont-ils, où habitent-ils, comment sont-ils ?
prompt_en: "Describe your family: who they are, where they live, what they're like."
points:
  - "combien vous êtes dans la famille"
  - "qui habite où"
  - "l'âge et le travail de chacun"
  - "une personne dont vous êtes proche"
points_en:
  - "Say how many people are in your family"
  - "Say who lives where — « ma sœur habite à… »"
  - "Give an age or a job for one or two of them"
  - "Pick one person you're close to and say why"
openers:
  - fr: "Bonjour ! Aujourd'hui, on parle de votre famille. Vous avez des frères ou des sœurs ?"
    en: "Hello! Today we're talking about your family. Do you have any brothers or sisters?"
  - fr: "Bonjour ! Parlons de votre famille. Vous habitez avec qui ?"
    en: "Hello! Let's talk about your family. Who do you live with?"
  - fr: "Bonjour ! J'aimerais connaître votre famille. Votre famille est grande ou petite ?"
    en: "Hello! I'd like to hear about your family. Is your family big or small?"
