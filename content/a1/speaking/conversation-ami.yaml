id: speak-a1-c-ami
level: a1
section: C
title: "Retrouver un ami"
prompt: |
  Vous rencontrez un ami que vous n'avez pas vu depuis longtemps. Saluez-le,
  demandez de ses nouvelles et parlez un peu de vous.
prompt_en: "You bump into a friend you haven't seen in a while. Say hello, ask how they are, and talk a little about yourself."
points:
  - "dire bonjour et demander « ça va ? »"
  - "dire ce que vous faites en ce moment"
  - "poser une question à votre ami"
  - "proposer de se revoir"
points_en:
  - "Say hello and ask how they're doing"
  - "Say what you're up to these days — work, studies, where you live"
  - "Ask them a question back — don't only answer"
  - "Suggest meeting up again, and say when"
openers:
  - fr: "Oh, salut ! Ça fait longtemps ! Comment ça va ?"
    en: "Oh, hi! It's been ages! How are you?"
  - fr: "Bonjour ! Quelle surprise ! Tu vas bien ?"
    en: "Hello! What a surprise! Are you well?"
  - fr: "Salut, c'est toi ! Je suis content de te voir. Quoi de neuf ?"
    en: "Hi, it's you! I'm happy to see you. What's new?"
  - fr: "Coucou ! Je suis très content de te voir ! Tu habites toujours ici ?"
    en: "Hey! I'm really happy to see you! Do you still live here?"
  - fr: "Ah, salut ! Ça va ? Qu'est-ce que tu fais en ce moment ?"
    en: "Ah, hi! How are you? What are you up to these days?"
