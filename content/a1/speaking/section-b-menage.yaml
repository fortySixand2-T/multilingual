id: speak-a1-b-menage
level: a1
section: B
title: "Partager les tâches à la maison"
prompt: |
  Votre colocataire ne fait jamais le ménage. Expliquez-lui pourquoi c'est un
  problème et proposez une solution simple.
points:
  - "les tâches à partager"
  - "un jour par semaine"
  - "ce que vous faites déjà"
  - "une solution acceptable"
openers:
  - fr: "Salut ! Tu veux me parler ? Il y a un problème ?"
    en: "Hi! You want to talk to me? Is there a problem?"
  - fr: "Salut ! Le ménage ? Oh, je n'ai pas le temps cette semaine. Pourquoi c'est important ?"
    en: "Hi! The cleaning? Oh, I don't have time this week. Why is it important?"
  - fr: "Bonjour ! Tu as l'air fâché. Qu'est-ce qui ne va pas ?"
    en: "Hello! You look annoyed. What's wrong?"
