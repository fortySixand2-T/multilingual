id: speak-a1-a-cours
level: a1
section: A
title: "S'inscrire à un cours"
prompt: |
  Vous voulez vous inscrire à un cours de sport. Posez des questions au
  secrétariat pour connaître les jours, les horaires, le prix et le matériel
  nécessaire.
points:
  - les jours et les horaires
  - le prix de l'inscription
  - le matériel nécessaire
  - le niveau demandé
openers:
  - fr: "Bonjour, club de sport, secrétariat. Je peux vous aider ?"
    en: "Hello, sports club, front desk. Can I help you?"
  - fr: "Bonjour et bienvenue au centre sportif ! Qu'est-ce que vous voulez savoir ?"
    en: "Hello and welcome to the sports centre! What would you like to know?"
  - fr: "Bonjour ! Vous voulez des informations sur nos cours ? Je vous écoute."
    en: "Hello! Would you like information about our classes? I'm listening."
  - fr: "Bonsoir, accueil du club ! Vous cherchez un cours de sport ?"
    en: "Good evening, club reception! Are you looking for a sports class?"
  - fr: "Oui, bonjour ! Secrétariat des cours de sport. Posez-moi vos questions."
    en: "Yes, hello! Sports classes office. Ask me your questions."
