id: speak-a1-c-cafe
level: a1
section: C
title: "Commander un café"
prompt: |
  Vous entrez dans un café. Commandez une boisson, demandez le prix et payez.
prompt_en: "You walk into a café. Order a drink, ask the price, and pay."
points:
  - "dire bonjour au serveur"
  - "commander avec « je voudrais… »"
  - "demander le prix"
  - "dire merci et payer"
points_en:
  - "Greet the server first — in French you always say bonjour"
  - "Order with « je voudrais… » (I would like…)"
  - "Ask how much it costs: « c'est combien ? »"
  - "Say whether you're paying by card or cash"
openers:
  - fr: "Bonjour, bienvenue au café ! Qu'est-ce que vous voulez boire ?"
    en: "Hello, welcome to the café! What would you like to drink?"
  - fr: "Bonjour ! Vous désirez ?"
    en: "Hello! What can I get you?"
  - fr: "Bonjour, asseyez-vous ! Je vous sers quelque chose ?"
    en: "Hello, take a seat! Can I get you something?"
  - fr: "Bonsoir ! Une table pour vous ? Qu'est-ce que je vous apporte ?"
    en: "Good evening! A table for you? What can I bring you?"
  - fr: "Salut ! Un café, un thé, un chocolat chaud ? Qu'est-ce qui vous fait plaisir ?"
    en: "Hi! A coffee, a tea, a hot chocolate? What would you like?"
