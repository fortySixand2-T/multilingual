id: speak-a1-a-restaurant
level: a1
section: A
title: "Réserver une table"
prompt: |
  Vous voulez réserver une table au restaurant. Posez des questions à
  l'employé(e) pour obtenir les informations dont vous avez besoin (jour, heure,
  nombre de personnes, prix du menu).
points:
  - le jour et l'heure
  - le nombre de personnes
  - le prix du menu
  - une question sur les plats
openers:
  - fr: "Restaurant Le Petit Jardin, bonjour ! Je peux vous aider ?"
    en: "Le Petit Jardin restaurant, hello! Can I help you?"
  - fr: "Bonjour, bienvenue au restaurant ! Vous voulez réserver une table ?"
    en: "Hello, welcome to the restaurant! Would you like to book a table?"
  - fr: "Bonjour ! Ici le restaurant Chez Paul. Qu'est-ce que vous désirez ?"
    en: "Hello! This is Chez Paul restaurant. What would you like?"
  - fr: "Allô, oui ? Restaurant La Bonne Table. Je vous écoute !"
    en: "Hello, yes? La Bonne Table restaurant. I'm listening!"
  - fr: "Bonsoir, et bienvenue ! C'est pour une réservation ?"
    en: "Good evening, and welcome! Is it for a booking?"
