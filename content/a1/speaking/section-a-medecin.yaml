id: speak-a1-a-medecin
level: a1
section: A
title: "Prendre rendez-vous chez le médecin"
prompt: |
  Vous voulez prendre rendez-vous chez le médecin. Téléphonez au cabinet et
  posez des questions pour connaître les horaires, l'adresse et les documents à
  apporter.
points:
  - "les jours et les heures possibles"
  - "l'adresse du cabinet"
  - "les documents à apporter"
  - "le prix de la consultation"
openers:
  - fr: "Allô, cabinet médical, bonjour ! Je vous écoute."
    en: "Hello, doctor's office, good morning! I'm listening."
  - fr: "Cabinet du docteur Martin, bonjour. Qu'est-ce que je peux faire pour vous ?"
    en: "Doctor Martin's office, hello. What can I do for you?"
  - fr: "Allô, bonjour ! Ici le cabinet médical. Vous voulez un rendez-vous ?"
    en: "Hello! This is the doctor's office. Would you like an appointment?"
