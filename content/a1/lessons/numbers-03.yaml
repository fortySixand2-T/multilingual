id: numbers-03
title: "Up to one hundred"
grammar_point: "bigger numbers"
grammar_category: "Expressions & communication"
est_minutes: 7
new_vocab: [onze, douze, vingt, treize, quatorze, quinze, seize, trente, quarante, cinquante, mille]
pass_threshold: 8.0
exercises:
  - id: numbers-03.e1
    type: mcq
    prompt: "« vingt » = ?"
    options: ["20", "12", "100"]
    answer: "20"
    explain: "vingt = twenty."

  - id: numbers-03.e2
    type: translate
    prompt: "Translate: “eleven”"
    answer: onze

  - id: numbers-03.e3
    type: mcq
    prompt: "What comes right after « onze »?"
    options: [douze, dix, vingt]
    answer: douze
    explain: "onze → douze (11 → 12)."

  - id: numbers-03.e4
    type: word_bank
    prompt: "Order: ten, eleven, twelve."
    tokens: [dix, onze, douze, vingt]
    answer: [dix, onze, douze]

  - id: numbers-03.e5
    type: match_pairs
    pairs:
      - [douze, "12"]
      - [vingt, "20"]
      - [cent, "100"]
  - id: numbers-03.e6
    type: match_pairs
    pairs:
      - ["trente", "thirty"]
      - ["quarante", "forty"]
      - ["cinquante", "fifty"]
      - ["mille", "a thousand"]

  - id: numbers-03.e7
    type: mcq
    prompt: "« 15 = ___ »"
    options: ["quinze", "quatorze", "seize"]
    answer: "quinze"
    explain: "13 treize, 14 quatorze, 15 quinze, 16 seize."
