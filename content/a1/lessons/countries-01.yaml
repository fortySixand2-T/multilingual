id: countries-01
title: "Countries"
grammar_point: "en / au / aux + country"
grammar_category: "Articles & determiners"
est_minutes: 8
new_vocab: [canada, quebec, france, belgique, suisse, maroc, algerie, tunisie, senegal, etats_unis, mexique, bresil, chine, japon, inde, allemagne, espagne, angleterre]
pass_threshold: 8.0
exercises:
  - id: countries-01.e1
    type: match_pairs
    pairs:
      - [le Canada, Canada]
      - [la France, France]
      - [la Belgique, Belgium]
      - [la Suisse, Switzerland]
      - [le Maroc, Morocco]

  - id: countries-01.e2
    type: match_pairs
    pairs:
      - [l'Algérie, Algeria]
      - [la Tunisie, Tunisia]
      - [le Sénégal, Senegal]
      - [le Mexique, Mexico]
      - [le Brésil, Brazil]

  - id: countries-01.e3
    type: match_pairs
    pairs:
      - [la Chine, China]
      - [le Japon, Japan]
      - [l'Inde, India]
      - [l'Allemagne, Germany]
      - [l'Espagne, Spain]

  - id: countries-01.e4
    type: mcq
    prompt: "« J'habite ___ France. »"
    options: ["en", "au", "aux"]
    answer: "en"
    explain: "Feminine countries take en: en France, en Belgique, en Chine."

  - id: countries-01.e5
    type: mcq
    prompt: "« Je vais ___ Canada. »"
    options: ["au", "en", "aux"]
    answer: "au"
    explain: "Masculine countries take au: au Canada, au Japon, au Maroc."

  - id: countries-01.e6
    type: mcq
    prompt: "« Il travaille ___ États-Unis. »"
    options: ["aux", "au", "en"]
    answer: "aux"
    explain: "Plural countries take aux: aux États-Unis."

  - id: countries-01.e7
    type: word_bank
    prompt: "Build: “I live in Quebec”"
    tokens: [J'habite, au, Québec, en]
    answer: [J'habite, au, Québec]

  - id: countries-01.e8
    type: listen_type
    audio_ref: a1/audio/angleterre.mp3
    answer: l'Angleterre
    prompt: "Type the country you hear."
