id: greetings-02
title: "Casual greetings"
grammar_point: "informal register"
grammar_category: "Expressions & communication"
est_minutes: 5
new_vocab: [oui, non, coucou, ca_va, enchante]
pass_threshold: 8.0
exercises:
  - id: greetings-02.e1
    type: mcq
    prompt: "« ___, ça va ? » (very casual hello)"
    options: [Coucou, Bonjour, Bonsoir]
    answer: Coucou
    explain: "« Coucou » is very informal."

  - id: greetings-02.e2
    type: translate
    prompt: "Translate: “pleased to meet you”"
    answer: enchanté
    accept: [enchante]

  - id: greetings-02.e3
    type: listen_type
    audio_ref: a1/audio/cava-qc.mp3
    answer: "ça va"
    prompt: "Type what you hear."

  - id: greetings-02.e4
    type: word_bank
    prompt: "Build: “Yes, I'm doing well.”"
    tokens: [Oui, ça, va, bien, Non]
    answer: [Oui, ça, va, bien]

  - id: greetings-02.e5
    type: mcq
    prompt: "The opposite of « oui » is…"
    options: [non, salut, merci]
    answer: non
    explain: "non = no."

  - id: greetings-02.e6
    type: match_pairs
    pairs:
      - [coucou, hey]
      - [enchanté, "nice to meet you"]
      - ["à bientôt", "see you soon"]
