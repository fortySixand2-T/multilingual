id: family-03
title: "Family — review"
grammar_point: "talking about your family"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [grand_mere, grand_pere, oncle, tante, cousin, cousine, bebe, parents]
pass_threshold: 8.0
exercises:
  - id: family-03.e1
    type: mcq
    prompt: "« ma mère » = ?"
    options: ["my mother", "my father", "my wife"]
    answer: "my mother"
    explain: "la mère = mother."

  - id: family-03.e2
    type: translate
    prompt: "Translate: “my family”"
    answer: "ma famille"
    accept: [famille]

  - id: family-03.e3
    type: word_bank
    prompt: "Build: “I have a brother.”"
    tokens: ["J'ai", un, frère, sœur]
    answer: ["J'ai", un, frère]

  - id: family-03.e4
    type: match_pairs
    pairs:
      - [père, father]
      - [sœur, sister]
      - [enfant, child]

  - id: family-03.e5
    type: mcq
    prompt: "« épouse » means…"
    options: [wife, daughter, mother]
    answer: wife
    explain: "l'épouse = wife."
  - id: family-03.e6
    type: match_pairs
    pairs:
      - ["grand-père", "grandfather"]
      - ["oncle", "uncle"]
      - ["tante", "aunt"]
      - ["cousin", "cousin (m)"]

  - id: family-03.e7
    type: match_pairs
    pairs:
      - ["cousine", "cousin (f)"]
      - ["bébé", "baby"]
      - ["parents", "parents"]

  - id: family-03.e8
    type: word_bank
    prompt: "Build: “My grandmother lives in Quebec.”"
    tokens: [ma, "grand-mère", habite, à, "Québec", mon]
    answer: [ma, "grand-mère", habite, à, "Québec"]
