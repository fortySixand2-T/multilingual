id: restaurant-03
title: "At the restaurant — review"
grammar_point: "ordering a full meal"
grammar_category: "Expressions & communication"
est_minutes: 9
new_vocab: [fourchette, serviette, plat_du_jour, nappe, chef, bon_appetit, delicieux, vegetarien]
pass_threshold: 8.0
exercises:
  - id: restaurant-03.e1
    type: mcq
    prompt: "Who brings your food?"
    options: ["le serveur", "le menu", "la table"]
    answer: "le serveur"
    explain: "le serveur = the waiter."

  - id: restaurant-03.e2
    type: translate
    prompt: "Translate: “the bill”"
    answer: "l'addition"
    accept: [addition]

  - id: restaurant-03.e3
    type: word_bank
    prompt: "Build: “The menu, please.”"
    tokens: [Le, menu, "s'il", vous, plaît]
    answer: [Le, menu, "s'il", vous, plaît]

  - id: restaurant-03.e4
    type: mcq
    prompt: "« commander » means…"
    options: ["to order", "to eat", "to pay"]
    answer: "to order"
    explain: "commander = to order."

  - id: restaurant-03.e5
    type: match_pairs
    pairs:
      - [restaurant, restaurant]
      - [boisson, drink]
      - [réservation, reservation]
  - id: restaurant-03.e6
    type: match_pairs
    pairs:
      - ["fourchette", "fork"]
      - ["serviette", "napkin"]
      - ["nappe", "tablecloth"]

  - id: restaurant-03.e7
    type: match_pairs
    pairs:
      - ["bon appétit", "enjoy your meal"]
      - ["délicieux", "delicious"]
      - ["végétarien", "vegetarian"]

  - id: restaurant-03.e8
    type: mcq
    prompt: "« Je prends le ___, s'il vous plaît. » (the dish of the day)"
    options: ["plat du jour", "pourboire", "chef"]
    answer: "plat du jour"
    explain: "le plat du jour = the dish of the day ; le chef le prépare."
