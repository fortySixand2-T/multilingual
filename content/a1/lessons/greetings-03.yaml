id: greetings-03
title: "Greetings — review"
grammar_point: "formal vs informal"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [bienvenue, bonne_nuit, a_demain, desole, stp, monsieur, madame, mademoiselle]
pass_threshold: 8.0
exercises:
  - id: greetings-03.e1
    type: mcq
    prompt: "A formal greeting in the evening?"
    options: [Bonsoir, Coucou, Salut]
    answer: Bonsoir
    explain: "Bonsoir = good evening (neutral/formal)."

  - id: greetings-03.e2
    type: translate
    prompt: "Translate: “hello” (formal)"
    answer: bonjour

  - id: greetings-03.e3
    type: word_bank
    prompt: "Build: “Hi, how's it going?”"
    tokens: [Salut, ça, va, Bonsoir]
    answer: [Salut, ça, va]

  - id: greetings-03.e4
    type: match_pairs
    pairs:
      - [bonjour, hello]
      - [salut, hi]
      - ["au revoir", goodbye]

  - id: greetings-03.e5
    type: mcq
    prompt: "« ___, je m'appelle Marie. » (meeting someone)"
    options: [Enchanté, Merci, Non]
    answer: Enchanté
    explain: "Enchanté = pleased to meet you."
  - id: greetings-03.e6
    type: match_pairs
    pairs:
      - ["bienvenue", "welcome"]
      - ["bonne nuit", "good night"]
      - ["à demain", "see you tomorrow"]
      - ["désolé", "sorry"]

  - id: greetings-03.e7
    type: match_pairs
    pairs:
      - ["s'il te plaît", "please (casual)"]
      - ["madame", "ma'am / Mrs"]
      - ["mademoiselle", "miss"]

  - id: greetings-03.e8
    type: mcq
    prompt: "« ___, vous avez l'heure ? » (polite, to a man you do not know)"
    options: ["Monsieur", "Salut", "Coucou"]
    answer: "Monsieur"
    explain: "« Monsieur » est formel ; « salut » et « coucou » sont familiers."
