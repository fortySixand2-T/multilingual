id: write-a-email-resa
level: a1
section: A
title: "Réserver une table"
min_words: 40
max_words: 100
prompt: |
  Vous voulez réserver une table au restaurant pour samedi soir. Écrivez un court
  courriel au restaurant : indiquez le jour, l'heure, le nombre de personnes, et
  posez une question (par exemple sur le menu ou le prix).
