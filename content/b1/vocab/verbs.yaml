# B1 verbs — the productive half of the level.
# b1 had 408 nouns and 13 verbs. These sit between a2's everyday actions
# (manger, travailler) and b2's argument verbs (nuancer, s'avérer): the
# constructions that carry a request, a procedure or a narrative.
#
# Where the bare verb is already taught at a1/a2 (commencer, essayer, finir),
# the B1 entry is the CONSTRUCTION — the preposition before the infinitive —
# and its gloss says so, so the card is not a near-duplicate of the a1 one.

# --- verbe + infinitif (à / de) ---
- id: commencer_a
  fr: commencer à
  en: to start to (+ infinitive)
  pos: verb
  tags: [verbs]

