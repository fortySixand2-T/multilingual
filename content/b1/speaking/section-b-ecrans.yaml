id: speak-b1-b-ecrans
level: b1
section: B
title: "Les écrans et les enfants"
prompt: |
  « Les enfants passent-ils trop de temps devant les écrans ? »
  Donnez votre opinion et justifiez-la avec des arguments et des exemples concrets.
points:
  - les effets sur la santé et le sommeil
  - l'apprentissage et l'accès à l'information
  - le rôle des parents
  - les alternatives (sport, lecture, jeux)
openers:
  - fr: "Bonjour ! Parlons des écrans : selon vous, les enfants passent-ils trop de temps devant les écrans ?"
    en: "Hello! Let's talk about screens: do you think children spend too much time in front of screens?"
  - fr: "Bonjour ! Beaucoup d'enfants ont une tablette dès trois ans. Est-ce que cela vous inquiète ?"
    en: "Hello! Many children have a tablet from the age of three. Does that worry you?"
  - fr: "Bonjour ! Certains parents interdisent les écrans, d'autres les utilisent pour éduquer. Quelle est votre position ?"
    en: "Hello! Some parents ban screens, others use them to teach. What's your position?"
  - fr: "Mon neveu de dix ans passe quatre heures par jour sur sa console. Vous trouvez ça normal ?"
    en: "My ten-year-old nephew spends four hours a day on his console. Do you think that's normal?"
  - fr: "Bonsoir ! À votre avis, les écrans sont-ils plutôt utiles ou plutôt dangereux pour les enfants ?"
    en: "Good evening! In your opinion, are screens more useful or more dangerous for children?"
