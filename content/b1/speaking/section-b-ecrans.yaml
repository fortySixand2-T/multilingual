id: speak-b1-b-ecrans
level: b1
section: B
title: "Les écrans et les enfants"
prompt: |
  « Les enfants passent-ils trop de temps devant les écrans ? »
  Donnez votre opinion et justifiez-la avec des arguments et des exemples concrets.
points:
  - les effets sur la santé et le sommeil
  - l'apprentissage et l'accès à l'information
  - le rôle des parents
  - les alternatives (sport, lecture, jeux)
