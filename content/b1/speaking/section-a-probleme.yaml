id: speak-b1-a-probleme
level: b1
section: A
title: "Signaler un problème au propriétaire"
prompt: |
  Le chauffage de votre logement ne fonctionne plus depuis une semaine. Appelez
  le propriétaire pour signaler le problème et obtenir une réparation.
points:
  - "décrire précisément le problème"
  - "depuis quand la situation s'est aggravée"
  - "se plaindre sans être agressif"
  - "obtenir une date d'intervention"
openers:
  - fr: "Allô, oui ? Ah, bonjour ! Vous avez un souci dans l'appartement ?"
    en: "Hello? Ah, hello! Is there a problem in the flat?"
  - fr: "Bonjour, ici monsieur Durand. Je vous écoute, qu'est-ce qui ne va pas ?"
    en: "Hello, this is Mr Durand. I'm listening, what's wrong?"
  - fr: "Allô, bonjour ! Je suis un peu pressé, mais dites-moi, qu'est-ce qui se passe ?"
    en: "Hello! I'm in a bit of a hurry, but tell me, what's going on?"
  - fr: "Oui, c'est moi, le propriétaire. Je ne vous entends pas très bien, mais je vous écoute."
    en: "Yes, it's me, the landlord. I can't hear you very well, but I'm listening."
  - fr: "Bonsoir ! Encore un problème ? Racontez-moi."
    en: "Good evening! Another problem? Tell me about it."
