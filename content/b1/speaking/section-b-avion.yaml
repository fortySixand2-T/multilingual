id: speak-b1-b-avion
level: b1
section: B
title: "Les voyages en avion"
prompt: |
  « Faut-il limiter les voyages en avion pour protéger l'environnement ? »
  Donnez votre opinion et défendez-la avec des arguments et des exemples.
points:
  - l'impact sur l'environnement
  - le coût et les alternatives (train, visioconférence)
  - la liberté de voyager
  - les emplois du secteur
openers:
  - fr: "Bonjour ! Un débat d'actualité : faut-il limiter les voyages en avion pour protéger l'environnement ? Quelle est votre position ?"
    en: "Hello! A topical debate: should we limit air travel to protect the environment? What's your position?"
  - fr: "Bonjour ! Certains veulent taxer davantage les billets d'avion pour protéger la planète. Vous trouvez que c'est une bonne idée ?"
    en: "Hello! Some people want to tax plane tickets more to protect the planet. Do you think it's a good idea?"
  - fr: "Bonjour ! Prendre l'avion est devenu très facile et peu cher. Selon vous, est-ce un problème pour l'environnement ?"
    en: "Hello! Flying has become very easy and cheap. In your view, is that a problem for the environment?"
