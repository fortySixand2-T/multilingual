id: speak-b1-a-formation
level: b1
section: A
title: "S'inscrire à une formation"
prompt: |
  Vous voulez vous inscrire à une formation professionnelle. Appelez l'organisme
  pour obtenir les informations nécessaires avant de décider.
points:
  - "s'inscrire : les délais et les conditions"
  - "le contenu et la durée"
  - "comment joindre un conseiller"
  - "ce que la formation permet d'obtenir"
openers:
  - fr: "Bonjour, centre de formation professionnelle, je vous écoute. En quoi puis-je vous aider ?"
    en: "Hello, vocational training centre, I'm listening. How can I help you?"
  - fr: "Bonjour ! Vous appelez au sujet de nos formations ? Je suis à votre disposition pour répondre à vos questions."
    en: "Hello! Are you calling about our training courses? I'm happy to answer your questions."
  - fr: "Organisme de formation, bonjour. Que souhaitez-vous savoir ?"
    en: "Training provider, hello. What would you like to know?"
  - fr: "Oui, bonjour ! Vous souhaitez des renseignements sur une de nos formations ? Je vous écoute."
    en: "Yes, hello! Would you like information about one of our courses? I'm listening."
  - fr: "Bonjour, service des inscriptions. Vous êtes salarié ou demandeur d'emploi ? Ça peut changer beaucoup de choses."
    en: "Hello, admissions office. Are you employed or a jobseeker? It can change quite a lot."
