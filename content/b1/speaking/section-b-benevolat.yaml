id: speak-b1-b-benevolat
level: b1
section: B
title: "Le bénévolat obligatoire"
prompt: |
  « Faudrait-il rendre le bénévolat obligatoire pour les jeunes ? »
  Défendez une position claire et répondez aux contre-arguments.
points:
  - "ce que le bénévolat apporte aux jeunes"
  - "la contrainte et la liberté de choisir"
  - "l'utilité pour la société"
  - "comparer avec d'autres pays"
openers:
  - fr: "Bonjour ! Notre sujet aujourd'hui : faudrait-il rendre le bénévolat obligatoire pour les jeunes ? Qu'en pensez-vous ?"
    en: "Hello! Our topic today: should volunteering be made compulsory for young people? What do you think?"
  - fr: "Bonjour ! Certains pays imposent un service civique aux jeunes. À votre avis, le bénévolat devrait-il être obligatoire ?"
    en: "Hello! Some countries require young people to do civic service. In your opinion, should volunteering be compulsory?"
  - fr: "Bonjour ! Le bénévolat, c'est généreux, mais peut-on obliger quelqu'un à être généreux ? Quelle est votre opinion ?"
    en: "Hello! Volunteering is generous, but can you force someone to be generous? What's your opinion?"
