id: conseils-b1-03
title: "Pros & cons — review"
grammar_point: "consolidating advice vocabulary"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [avantage, inconvenient, hypothese, erreur, recommandation, alternative, precaution, doute, compromis, bilan]
pass_threshold: 8.0
exercises:
  - id: conseils-b1-03.e1
    type: mcq
    prompt: "« Chaque solution a un avantage et un ___. » (Every solution has an advantage and a drawback.)"
    options: [inconvénient, conseil, choix]
    answer: inconvénient
    explain: "un inconvénient = a drawback, downside."

  - id: conseils-b1-03.e2
    type: translate
    prompt: "Translate: “the mistake”"
    answer: erreur
    accept: ["l'erreur", "une erreur"]

  - id: conseils-b1-03.e3
    type: listen_type
    audio_ref: b1/audio/avantage.mp3
    answer: avantage
    prompt: "Type the word you hear."

  - id: conseils-b1-03.e4
    type: word_bank
    prompt: "Build: “it's only a hypothesis”"
    tokens: [c, est, seulement, une, hypothèse, erreur]
    answer: [c, est, seulement, une, hypothèse]

  - id: conseils-b1-03.e5
    type: match_pairs
    pairs:
      - [avantage, advantage]
      - [inconvénient, drawback]
      - [erreur, mistake]
  - id: conseils-b1-03.e6
    type: match_pairs
    pairs:
      - ["recommandation", "recommendation"]
      - ["alternative", "alternative"]
      - ["précaution", "precaution"]

  - id: conseils-b1-03.e7
    type: mcq
    prompt: "« Après discussion, ils ont trouvé un ___ acceptable pour tous. »"
    options: ["compromis", "doute", "bilan"]
    answer: "compromis"
    explain: "un compromis = a compromise, accepté par les deux côtés."
