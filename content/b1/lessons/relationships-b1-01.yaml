id: relationships-b1-01
title: "Relationships"
grammar_point: "reflexive verbs: se disputer, se réconcilier"
grammar_category: "Verb conjugation & tenses"
est_minutes: 8
new_vocab: [couple, amitie, confiance, dispute, rupture, reconciliation, divorce, fiancailles, celibataire, conjoint, belle_famille, entente, respect, jalousie, soutien, complicite, malentendu, se_disputer, rencontre, voisin]
pass_threshold: 8.0
exercises:
  - id: relationships-b1-01.e1
    type: match_pairs
    pairs:
      - [couple, couple]
      - [amitié, friendship]
      - [confiance, trust]
      - [respect, respect]
      - [soutien, support]

  - id: relationships-b1-01.e2
    type: match_pairs
    pairs:
      - [dispute, argument]
      - [rupture, break-up]
      - [réconciliation, reconciliation]
      - [malentendu, misunderstanding]
      - [jalousie, jealousy]

  - id: relationships-b1-01.e3
    type: match_pairs
    pairs:
      - [conjoint, spouse]
      - [fiançailles, engagement]
      - [belle-famille, in-laws]
      - [célibataire, single]
      - [voisin, neighbour]

  - id: relationships-b1-01.e4
    type: mcq
    prompt: "« Ils ___ souvent. » (they argue)"
    options: ["se disputent", "disputent", "se dispute"]
    answer: "se disputent"
    explain: "se disputer is reflexive: ils se disputent."

  - id: relationships-b1-01.e5
    type: mcq
    prompt: "« un malentendu » is…"
    options: [a misunderstanding, a break-up, a wedding]
    answer: a misunderstanding
    explain: "mal + entendu = badly heard → a misunderstanding."

  - id: relationships-b1-01.e6
    type: word_bank
    prompt: "Build: “I have confidence in him”"
    tokens: [J'ai, confiance, en, lui, respect]
    answer: [J'ai, confiance, en, lui]

  - id: relationships-b1-01.e7
    type: translate
    prompt: "Translate: “a break-up”"
    answer: "une rupture"
    accept: [rupture]

  - id: relationships-b1-01.e8
    type: listen_type
    audio_ref: b1/audio/complicite.mp3
    answer: complicité
    prompt: "Type the word you hear."
