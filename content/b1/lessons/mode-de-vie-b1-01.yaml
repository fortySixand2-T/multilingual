id: mode-de-vie-b1-01
title: "A balanced life"
grammar_point: "subjonctif présent after « il faut que »"
est_minutes: 6
new_vocab: [bien_etre, equilibre, alimentation, sommeil]
pass_threshold: 8.0
exercises:
  - id: mode-de-vie-b1-01.e1
    type: mcq
    prompt: "« Il faut que tu ___ plus pour être en forme. » (You need to sleep more to be fit.)"
    options: [dormes, dors, dormir]
    answer: dormes
    explain: "after « il faut que », use the subjunctive: que tu dormes."

  - id: mode-de-vie-b1-01.e2
    type: translate
    prompt: "Translate: “well-being”"
    answer: bien-être
    accept: ["le bien-être"]

  - id: mode-de-vie-b1-01.e3
    type: listen_type
    audio_ref: b1/audio/sommeil.mp3
    answer: sommeil
    prompt: "Type the word you hear."

  - id: mode-de-vie-b1-01.e4
    type: word_bank
    prompt: "Build: “a balanced diet”"
    tokens: [une, alimentation, équilibrée, sommeil]
    answer: [une, alimentation, équilibrée]

  - id: mode-de-vie-b1-01.e5
    type: match_pairs
    pairs:
      - [bien-être, well-being]
      - [équilibre, balance]
      - [sommeil, sleep]
