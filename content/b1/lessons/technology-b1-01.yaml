id: technology-b1-01
title: "Devices & the internet"
grammar_point: "giving instructions with the imperative"
grammar_category: "Verb conjugation & tenses"
est_minutes: 8
new_vocab: [mise_a_jour, sauvegarde, piratage, virus, navigateur, moteur_recherche, forfait, connexion, debit, wifi, imprimante, haut_parleur, chargeur, batterie, plateforme, parametres, tutoriel, installer, brancher, partager]
pass_threshold: 8.0
exercises:
  - id: technology-b1-01.e1
    type: match_pairs
    pairs:
      - [mise à jour, update]
      - [sauvegarde, backup]
      - [navigateur, browser]
      - [moteur de recherche, search engine]
      - [paramètres, settings]

  - id: technology-b1-01.e2
    type: match_pairs
    pairs:
      - [piratage, hacking]
      - [virus, virus]
      - [connexion, connection]
      - [débit, bandwidth]
      - [forfait, plan]

  - id: technology-b1-01.e3
    type: match_pairs
    pairs:
      - [imprimante, printer]
      - [haut-parleur, speaker]
      - [chargeur, charger]
      - [batterie, battery]
      - [tutoriel, tutorial]

  - id: technology-b1-01.e4
    type: mcq
    prompt: "« ___ la mise à jour avant de continuer. » (Install)"
    options: ["Installez", "Installer", "Vous installez"]
    answer: "Installez"
    explain: "The imperative gives instructions: Installez, Branchez, Partagez."

  - id: technology-b1-01.e5
    type: mcq
    prompt: "Losing your files is prevented by « une ___ »."
    options: ["sauvegarde", "mise à jour", "connexion"]
    answer: "sauvegarde"
    explain: "une sauvegarde = a backup."

  - id: technology-b1-01.e6
    type: word_bank
    prompt: "Build: “my battery is dead”"
    tokens: [Ma, batterie, est, morte, chargeur]
    answer: [Ma, batterie, est, morte]

  - id: technology-b1-01.e7
    type: translate
    prompt: "Translate: “to share”"
    answer: partager

  - id: technology-b1-01.e8
    type: listen_type
    audio_ref: b1/audio/imprimante.mp3
    answer: imprimante
    prompt: "Type the word you hear."
