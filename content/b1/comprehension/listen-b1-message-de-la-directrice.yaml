id: listen-b1-message-de-la-directrice
level: b1
skill: listening
title: "Un message de la directrice"
time_limit_seconds: 120
audio_ref: b1/audio/listen-b1-message-de-la-directrice.mp3
accent: qc
allow_replay: true
pass_threshold: 0.6
script: |
  Bonjour Julien, c'est Martine. Je t'appelle au sujet du problème avec le logiciel
  de paie. Je sais que ton équipe cherche à le résoudre depuis lundi. Je voudrais te
  proposer de faire une réunion jeudi matin avec le fournisseur. Ça devrait nous
  permettre de trouver une solution avant la fin du mois. D'ici là, il faut
  maintenir l'ancien système. Merci de ne pas oublier de prévenir les employés que
  leur salaire arrivera à la date habituelle. Rappelle-moi avant midi, je t'en prie.
questions:
  - id: listen-b1-message-de-la-directrice.q1
    prompt: "Pourquoi Martine appelle-t-elle Julien ?"
    options:
      - "Pour un problème avec le logiciel de paie"
      - "Pour annuler une réunion"
      - "Pour parler de son salaire"
    answer: "Pour un problème avec le logiciel de paie"
    explain: "« Je t'appelle au sujet du problème avec le logiciel de paie »."
  - id: listen-b1-message-de-la-directrice.q2
    prompt: "Que propose Martine ?"
    options:
      - "Une réunion jeudi matin avec le fournisseur"
      - "Un nouveau logiciel"
      - "Un jour de congé lundi"
    answer: "Une réunion jeudi matin avec le fournisseur"
    explain: "« te proposer de faire une réunion jeudi matin avec le fournisseur »."
  - id: listen-b1-message-de-la-directrice.q3
    prompt: "Que faut-il faire d'ici là ?"
    options:
      - "Maintenir l'ancien système"
      - "Payer les employés en avance"
      - "Changer de fournisseur"
    answer: "Maintenir l'ancien système"
    explain: "« D'ici là, il faut maintenir l'ancien système »."
