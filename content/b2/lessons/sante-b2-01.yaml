id: sante-b2-01
title: "Public health & relative pronouns"
grammar_point: "les pronoms relatifs composés : auquel, à laquelle (après « à »)"
grammar_category: "Pronouns"
est_minutes: 7
new_vocab: [epidemie, vaccin, systeme_de_sante, obesite, esperance_de_vie, depistage]
pass_threshold: 8.0
exercises:
  - id: sante-b2-01.e1
    type: mcq
    prompt: "« C'est un vaccin ___ des millions de personnes font confiance. » (…in which millions trust.)"
    options: [auquel, lequel, dont]
    answer: auquel
    explain: "« Faire confiance à quelque chose » → le relatif devient « auquel »."
  - id: sante-b2-01.e2
    type: translate
    prompt: "Translate: “life expectancy”"
    answer: "l'espérance de vie"
    accept: ["espérance de vie", "l'esperance de vie", "esperance de vie", "l esperance de vie"]
  - id: sante-b2-01.e3
    type: listen_type
    audio_ref: b2/audio/vaccin.mp3
    answer: vaccin
    prompt: "Type the word you hear."
  - id: sante-b2-01.e4
    type: word_bank
    prompt: "Build: “the reform (that) everyone is talking about”"
    tokens: [la, réforme, dont, tout, le, monde, parle, laquelle]
    answer: [la, réforme, dont, tout, le, monde, parle]
  - id: sante-b2-01.e5
    type: match_pairs
    pairs:
      - ["épidémie", "epidemic"]
      - ["dépistage", "screening"]
      - ["obésité", "obesity"]
