id: societe-b2-04
title: "Inclusion & exclusion"
grammar_point: "nominalization: inclure → l'inclusion"
grammar_category: "Sentence structures"
est_minutes: 8
new_vocab: [cohesion_sociale, vivre_ensemble, inclusion, exclusion, marginalisation, itinerance, banque_alimentaire, benevolat, organisme_communautaire, filet_social, aide_sociale, logement_abordable, fosse_generationnel, individualisme, consumerisme, stigmatisation, prejuge]
pass_threshold: 8.0
exercises:
  - id: societe-b2-04.e1
    type: match_pairs
    pairs:
      - [cohésion sociale, social cohesion]
      - [vivre-ensemble, social harmony]
      - [inclusion, inclusion]
      - [exclusion, exclusion]
      - [marginalisation, marginalization]

  - id: societe-b2-04.e2
    type: match_pairs
    pairs:
      - [itinérance, homelessness]
      - [banque alimentaire, food bank]
      - [bénévolat, volunteering]
      - [organisme communautaire, community organization]
      - [filet social, social safety net]

  - id: societe-b2-04.e3
    type: match_pairs
    pairs:
      - [aide sociale, welfare]
      - [logement abordable, affordable housing]
      - [fossé générationnel, generation gap]
      - [stigmatisation, stigmatization]
      - [préjugé, prejudice]

  - id: societe-b2-04.e4
    type: mcq
    prompt: "In Québec, homelessness is called…"
    options: ["l'itinérance", "l'exclusion", "le bénévolat"]
    answer: "l'itinérance"
    explain: "l'itinérance is the standard Québec term for homelessness."

  - id: societe-b2-04.e5
    type: mcq
    prompt: "The noun formed from « marginaliser » is…"
    options: ["la marginalisation", "le marginal", "la marge"]
    answer: "la marginalisation"
    explain: "-iser verbs nominalize in -isation: stigmatiser → la stigmatisation."

  - id: societe-b2-04.e6
    type: word_bank
    prompt: "Build: “the social safety net protects the most vulnerable”"
    tokens: [Le, filet, social, protège, les, plus, vulnérables]
    answer: [Le, filet, social, protège, les, plus, vulnérables]

  - id: societe-b2-04.e7
    type: translate
    prompt: "Translate: “affordable housing”"
    answer: "le logement abordable"
    accept: ["logement abordable"]

  - id: societe-b2-04.e8
    type: listen_type
    audio_ref: b2/audio/itinerance.mp3
    answer: itinérance
    prompt: "Type the word you hear."
