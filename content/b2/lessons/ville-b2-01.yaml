id: ville-b2-01
title: "Urban planning & intensity"
grammar_point: "l'intensité liée à une cause : « d'autant plus … que »"
grammar_category: "Logical connectors"
est_minutes: 7
new_vocab: [urbanisme, mobilite, embouteillage, peripherie, amenagement, densite]
pass_threshold: 8.0
exercises:
  - id: ville-b2-01.e1
    type: mcq
    prompt: "« Les embouteillages sont ___ plus fréquents que la ville est dense. » (…all the more frequent as…)"
    options: ["d'autant", "autant", "aussi"]
    answer: "d'autant"
    explain: "« D'autant plus … que » relie l'intensité (plus fréquents) à sa cause (la ville est dense)."
  - id: ville-b2-01.e2
    type: translate
    prompt: "Translate: “urban planning”"
    answer: "l'urbanisme"
    accept: ["urbanisme", "l urbanisme"]
  - id: ville-b2-01.e3
    type: listen_type
    audio_ref: b2/audio/embouteillage.mp3
    answer: embouteillage
    prompt: "Type the word you hear."
  - id: ville-b2-01.e4
    type: word_bank
    prompt: "Build: “This district is all the more sought-after as it attracts families.”"
    tokens: [ce, quartier, est, "d'autant", plus, recherché, "qu'il", attire, les, familles, aussi]
    answer: [ce, quartier, est, "d'autant", plus, recherché, "qu'il", attire, les, familles]
  - id: ville-b2-01.e5
    type: match_pairs
    pairs:
      - ["mobilité", "mobility"]
      - ["périphérie", "outskirts"]
      - ["densité", "density"]
