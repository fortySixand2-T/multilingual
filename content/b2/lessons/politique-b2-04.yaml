id: politique-b2-04
title: "Elections & institutions"
grammar_point: "hypothesis with si + imparfait"
grammar_category: "Verb conjugation & tenses"
est_minutes: 9
new_vocab: [suffrage, circonscription, candidat, campagne_electorale, sondage, coalition, opposition, majorite, minorite, laicite, federalisme, province, assemblee_nationale, premier_ministre, ministre, populisme, extremisme]
pass_threshold: 8.0
exercises:
  - id: politique-b2-04.e1
    type: match_pairs
    pairs:
      - [suffrage universel, universal suffrage]
      - [circonscription, riding]
      - [candidat, candidate]
      - [campagne électorale, election campaign]
      - [sondage, poll]

  - id: politique-b2-04.e2
    type: match_pairs
    pairs:
      - [coalition, coalition]
      - [opposition, the opposition]
      - [majorité, majority]
      - [minorité, minority]
      - [fédéralisme, federalism]

  - id: politique-b2-04.e3
    type: match_pairs
    pairs:
      - [laïcité, secularism]
      - [Assemblée nationale, National Assembly]
      - [premier ministre, premier]
      - [populisme, populism]
      - [extrémisme, extremism]

  - id: politique-b2-04.e4
    type: mcq
    prompt: "Québec's legislature is called…"
    options: ["l'Assemblée nationale", "le Sénat", "la Chambre des communes"]
    answer: "l'Assemblée nationale"
    explain: "Québec's provincial legislature is l'Assemblée nationale."

  - id: politique-b2-04.e5
    type: mcq
    prompt: "« Si le parti ___ plus de sièges, il gouvernerait seul. »"
    options: ["avait", "a", "aura"]
    answer: "avait"
    explain: "si + imparfait → conditional: s'il avait…, il gouvernerait…"

  - id: politique-b2-04.e6
    type: word_bank
    prompt: "Build: “the polls predict a minority government”"
    tokens: [Les, sondages, prévoient, un, gouvernement, minoritaire]
    answer: [Les, sondages, prévoient, un, gouvernement, minoritaire]

  - id: politique-b2-04.e7
    type: translate
    prompt: "Translate: “secularism”"
    answer: "la laïcité"
    accept: ["laïcité"]

  - id: politique-b2-04.e8
    type: listen_type
    audio_ref: b2/audio/circonscription.mp3
    answer: circonscription
    prompt: "Type the word you hear."
  - id: politique-b2-04.e9
    type: mcq
    prompt: "Le Québec est une ___ canadienne."
    options: ["province", "circonscription", "coalition"]
    answer: "province"
    explain: "une province = a province ; le Québec est l'une des dix provinces canadiennes."
