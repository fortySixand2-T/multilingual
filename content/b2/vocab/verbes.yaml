# B2 verbs and verbal locutions — the productive half of the level.
# The other b2 decks are thematic nouns; these are what you conjugate to *use*
# them in Expression orale/écrite. Grouped by the construction they demand:
# verb + preposition, verbs governing the subjunctive, and the verbs of analysis
# an argued essay or monologue is built from.

