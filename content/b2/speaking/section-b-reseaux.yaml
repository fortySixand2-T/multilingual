id: speak-b2-b-reseaux
level: b2
section: B
title: "Les réseaux sociaux et l'information"
prompt: |
  « Les réseaux sociaux sont-ils une menace pour la qualité de l'information ? »
  Défendez un point de vue argumenté en nuançant et en donnant des exemples.
points:
  - la diffusion des fausses informations
  - l'accès rapide et démocratisé à l'information
  - le rôle des algorithmes et des bulles de filtres
  - la responsabilité des plateformes et des utilisateurs
openers:
  - fr: "Bonjour ! Les réseaux sociaux sont-ils une menace pour la qualité de l'information ? Quel est votre point de vue ?"
    en: "Hello! Are social networks a threat to the quality of information? What's your point of view?"
  - fr: "Bonjour ! Aujourd'hui, beaucoup de gens s'informent uniquement sur les réseaux sociaux. Est-ce que cela vous semble inquiétant ?"
    en: "Hello! Today many people get their news only from social media. Does that seem worrying to you?"
  - fr: "Bonjour ! Les réseaux sociaux propagent de fausses informations, mais ils donnent aussi la parole à tous. Comment voyez-vous les choses ?"
    en: "Hello! Social media spreads false information, but it also gives everyone a voice. How do you see it?"
