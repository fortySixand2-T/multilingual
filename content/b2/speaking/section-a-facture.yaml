id: speak-b2-a-facture
level: b2
section: A
title: "Contester une facture"
prompt: |
  Votre facture d'électricité a doublé sans explication. Vous appelez le service
  client pour comprendre et obtenir une régularisation.
points:
  - "faire préciser le détail de la facture"
  - "ce qui pourrait expliquer la hausse"
  - "ce dont vous avez besoin comme preuve écrite"
  - "obtenir un engagement daté"
openers:
  - fr: "Service client, bonjour. Je m'appelle Claire, que puis-je faire pour vous ?"
    en: "Customer service, hello. My name is Claire, what can I do for you?"
  - fr: "Bonjour, service client électricité. Pouvez-vous m'indiquer la raison de votre appel ?"
    en: "Hello, electricity customer service. Could you tell me why you're calling?"
  - fr: "Bonjour et merci de votre patience. Je vous écoute, quel est le problème avec votre facture ?"
    en: "Hello and thank you for waiting. I'm listening, what's the problem with your bill?"
  - fr: "Service réclamations, bonjour. Pourriez-vous me donner votre numéro client et m'expliquer la situation ?"
    en: "Complaints department, hello. Could you give me your customer number and explain the situation?"
  - fr: "Oui, je vous écoute. Il s'agit d'une facture, c'est bien cela ?"
    en: "Yes, I'm listening. It's about a bill, is that right?"
