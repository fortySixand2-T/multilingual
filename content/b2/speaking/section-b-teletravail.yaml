id: speak-b2-b-teletravail
level: b2
section: B
title: "Le télétravail"
prompt: |
  « Le télétravail est-il une bonne chose pour les salariés et les entreprises ? »
  Développez une position nuancée, avec des arguments structurés et des exemples.
points:
  - l'équilibre vie professionnelle / vie privée
  - la productivité et le lien social
  - les coûts pour l'entreprise et l'environnement
  - les inégalités entre métiers
openers:
  - fr: "Bonjour ! Le télétravail est-il une bonne chose pour les salariés et les entreprises ? Quelle est votre position ?"
    en: "Hello! Is remote working a good thing for employees and companies? What's your position?"
  - fr: "Bonjour ! Depuis quelques années, le télétravail s'est généralisé. Selon vous, est-ce un progrès ?"
    en: "Hello! In recent years remote working has become widespread. In your view, is it progress?"
  - fr: "Bonjour ! Certaines entreprises demandent à leurs salariés de revenir au bureau. Les comprenez-vous ?"
    en: "Hello! Some companies are asking staff to come back to the office. Do you understand why?"
