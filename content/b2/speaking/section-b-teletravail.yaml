id: speak-b2-b-teletravail
level: b2
section: B
title: "Le télétravail"
prompt: |
  « Le télétravail est-il une bonne chose pour les salariés et les entreprises ? »
  Développez une position nuancée, avec des arguments structurés et des exemples.
points:
  - l'équilibre vie professionnelle / vie privée
  - la productivité et le lien social
  - les coûts pour l'entreprise et l'environnement
  - les inégalités entre métiers
