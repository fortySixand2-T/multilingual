id: read-b2-collective-memory
level: b2
skill: reading
title: "À qui appartient la mémoire collective ?"
time_limit_seconds: 360
pass_threshold: 0.6
passage: |
  Chaque pays entretient un récit national. On y apprend des dates, une chronologie
  rassurante, quelques grandes figures. Ce récit n'est pourtant jamais neutre : il
  choisit ce qu'il faut retenir, et surtout ce qu'il vaut mieux oublier.
  Prenons la colonisation. Pendant tout un siècle, elle fut présentée comme une
  conquête civilisatrice ; la décolonisation a imposé une autre lecture. Les peuples
  autochtones, longtemps absents des manuels, y figurent désormais — parfois en
  quelques lignes seulement. Les archives, elles, ne se laissent pas résumer aussi
  facilement : elles témoignent de ce que la version officielle préférait taire.
  Faut-il alors réécrire l'histoire à chaque époque ? Les historiens distinguent
  soigneusement deux gestes. Relire des sources, comparer un traité et son
  application, constater qu'un empire a menti sur ses intentions : c'est le travail
  normal de la discipline. Nier des faits établis pour servir une cause, c'est du
  révisionnisme, et rien d'autre.
  Restent les symboles. Faut-il déboulonner une statue, conserver un vestige,
  organiser une commémoration ? Le passage d'une monarchie à une république, l'issue
  d'un référendum, la trace d'une révolution : chaque société tranche à sa manière.
  Nos ancêtres n'ont pas laissé de mode d'emploi, et l'on s'étonne encore que chaque génération rouvre le dossier. La mémoire collective se discute ;
  c'est peut-être sa seule définition solide.
questions:
  - id: read-b2-collective-memory.q1
    prompt: "Que dit le texte du récit national ?"
    options:
      - "Il n'est jamais neutre : il choisit ce qu'il faut retenir et ce qu'il vaut mieux oublier"
      - "Il est établi une fois pour toutes par les historiens"
      - "Il ne contient que des dates vérifiables"
    answer: "Il n'est jamais neutre : il choisit ce qu'il faut retenir et ce qu'il vaut mieux oublier"
    explain: "« Ce récit n'est pourtant jamais neutre : il choisit ce qu'il faut retenir, et surtout ce qu'il vaut mieux oublier »."
  - id: read-b2-collective-memory.q2
    prompt: "Comment la colonisation a-t-elle longtemps été présentée ?"
    options:
      - "Comme une conquête civilisatrice"
      - "Comme une catastrophe reconnue dès le départ"
      - "Comme un simple épisode commercial"
    answer: "Comme une conquête civilisatrice"
    explain: "« elle fut présentée comme une conquête civilisatrice »."
  - id: read-b2-collective-memory.q3
    prompt: "Quelle place les peuples autochtones occupent-ils dans les manuels ?"
    options:
      - "Longtemps absents, ils y figurent désormais, parfois en quelques lignes"
      - "Ils y occupent la majorité des chapitres"
      - "Ils en ont été retirés récemment"
    answer: "Longtemps absents, ils y figurent désormais, parfois en quelques lignes"
    explain: "« longtemps absents des manuels, y figurent désormais — parfois en quelques lignes seulement »."
  - id: read-b2-collective-memory.q4
    prompt: "Quelle distinction les historiens énoncent-ils ?"
    options:
      - "Relire les sources est le travail normal de la discipline ; nier des faits établis est du révisionnisme"
      - "Toute relecture du passé constitue du révisionnisme"
      - "Seules les archives officielles peuvent être consultées"
    answer: "Relire les sources est le travail normal de la discipline ; nier des faits établis est du révisionnisme"
    explain: "« c'est le travail normal de la discipline. Nier des faits établis pour servir une cause, c'est du révisionnisme »."
  - id: read-b2-collective-memory.q5
    prompt: "Sur quelle idée le texte se termine-t-il ?"
    options:
      - "La mémoire collective se discute"
      - "Chaque statue doit être conservée intacte"
      - "Les ancêtres ont fixé la règle à suivre"
    answer: "La mémoire collective se discute"
    explain: "« La mémoire collective se discute ; c'est peut-être sa seule définition solide »."
