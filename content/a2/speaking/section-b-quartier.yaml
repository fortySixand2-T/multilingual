id: speak-a2-b-quartier
level: a2
section: B
title: "Convaincre un ami de déménager près de chez vous"
prompt: |
  Un ami cherche un logement. Convainquez-le de venir habiter dans votre
  quartier plutôt qu'ailleurs.
points:
  - "les transports et les commerces"
  - "le loyer dans le quartier"
  - "le calme ou l'animation"
  - "être voisins"
openers:
  - fr: "Salut ! Je cherche un nouvel appartement, mais je ne sais pas dans quel quartier. Tu as une idée ?"
    en: "Hi! I'm looking for a new flat, but I don't know which neighbourhood. Any ideas?"
  - fr: "Salut ! Ton quartier ? Je ne sais pas, je préfère habiter près de mon travail. Pourquoi chez toi ?"
    en: "Hi! Your neighbourhood? I don't know, I'd rather live near work. Why near you?"
  - fr: "Salut ! Je dois déménager le mois prochain. Tu penses que ton quartier est bien pour moi ?"
    en: "Hi! I have to move next month. Do you think your neighbourhood would suit me?"
