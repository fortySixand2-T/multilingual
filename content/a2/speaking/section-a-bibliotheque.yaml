id: speak-a2-a-bibliotheque
level: a2
section: A
title: "S'inscrire à la bibliothèque"
prompt: |
  Vous voulez vous inscrire à la bibliothèque municipale. Posez des questions à
  l'accueil pour connaître les conditions d'inscription et le fonctionnement des
  emprunts.
points:
  - "les documents nécessaires"
  - "le prix de la carte"
  - "le nombre de livres empruntables"
  - "les horaires d'ouverture"
openers:
  - fr: "Bonjour, bienvenue à la bibliothèque municipale ! Je peux vous renseigner ?"
    en: "Hello, welcome to the public library! Can I help you with any information?"
  - fr: "Bonjour ! Accueil de la bibliothèque. Qu'est-ce que je peux faire pour vous ?"
    en: "Hello! Library front desk. What can I do for you?"
  - fr: "Bonjour ! Vous souhaitez vous inscrire ou simplement vous renseigner ? Je vous écoute."
    en: "Hello! Would you like to sign up, or just find out more? I'm listening."
  - fr: "Bonjour, c'est votre première visite ici ? Qu'est-ce que vous aimeriez savoir ?"
    en: "Hello, is this your first visit here? What would you like to know?"
  - fr: "Bonsoir ! La bibliothèque ferme dans une heure, mais j'ai le temps de répondre à vos questions."
    en: "Good evening! The library closes in an hour, but I have time to answer your questions."
