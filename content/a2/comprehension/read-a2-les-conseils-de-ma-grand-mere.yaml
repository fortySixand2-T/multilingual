id: read-a2-les-conseils-de-ma-grand-mere
level: a2
skill: reading
title: "Les conseils de ma grand-mère"
time_limit_seconds: 180
pass_threshold: 0.6
passage: |
  Ma grand-mère a beaucoup de conseils. « Avant de quitter la maison, ferme les
  fenêtres. Il ne faut pas jeter le pain. Pour vivre longtemps, mange des légumes
  et marche un peu chaque jour. Ne laisse pas les enfants toucher les plantes du
  jardin : elles peuvent mourir. Si tu veux devenir médecin, il faut beaucoup
  travailler. Quand tu vas recevoir un cadeau, dis merci. Et c'est gentil d'offrir
  des fleurs ! » Elle aime aussi imaginer l'avenir de ses petits-enfants. Ses
  conseils peuvent sembler un peu démodés, mais j'adore entendre ses histoires.
questions:
  - id: read-a2-les-conseils-de-ma-grand-mere.q1
    prompt: "Que faut-il faire avant de quitter la maison ?"
    options:
      - "Fermer les fenêtres"
      - "Jeter le pain"
      - "Offrir des fleurs"
    answer: "Fermer les fenêtres"
    explain: "« Avant de quitter la maison, ferme les fenêtres. »"
  - id: read-a2-les-conseils-de-ma-grand-mere.q2
    prompt: "Pourquoi les enfants ne doivent-ils pas toucher les plantes ?"
    options:
      - "Elles peuvent mourir"
      - "Elles sont dangereuses"
      - "Elles sont à vendre"
    answer: "Elles peuvent mourir"
    explain: "« Ne laisse pas les enfants toucher les plantes du jardin : elles peuvent mourir. »"
  - id: read-a2-les-conseils-de-ma-grand-mere.q3
    prompt: "Selon la grand-mère, que faut-il pour devenir médecin ?"
    options:
      - "Beaucoup travailler"
      - "Manger des légumes"
      - "Recevoir des cadeaux"
    answer: "Beaucoup travailler"
    explain: "« Si tu veux devenir médecin, il faut beaucoup travailler. »"
  - id: read-a2-les-conseils-de-ma-grand-mere.q4
    prompt: "Qu'est-ce que la personne adore ?"
    options:
      - "Entendre les histoires de sa grand-mère"
      - "Imaginer l'avenir"
      - "Travailler dans le jardin"
    answer: "Entendre les histoires de sa grand-mère"
    explain: "« j'adore entendre ses histoires »."
