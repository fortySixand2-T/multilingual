id: listen-a2-au-telephone-et-a-la-poste
level: a2
skill: listening
title: "Au téléphone et à la poste"
time_limit_seconds: 110
audio_ref: a2/audio/listen-a2-au-telephone-et-a-la-poste.mp3
accent: qc
allow_replay: true
pass_threshold: 0.6
script: |
  Allô ? Ça sonne, mais personne ne veut répondre. J'ai laissé un message sur sa
  boîte vocale. Bon, je vais raccrocher. Notre conversation d'hier était longue ;
  nous aimons discuter. Et à la poste ? J'envoie une enveloppe avec un timbre, et
  aussi un colis pour ma mère. Vérifiez bien l'adresse. Il faut une signature ici.
  Merci beaucoup ! Je dois la remercier pour son cadeau.
questions:
  - id: listen-a2-au-telephone-et-a-la-poste.q1
    prompt: "Que fait la personne quand personne ne répond ?"
    options:
      - "Elle laisse un message sur la boîte vocale"
      - "Elle rappelle tout de suite"
      - "Elle envoie un colis"
    answer: "Elle laisse un message sur la boîte vocale"
    explain: "« J'ai laissé un message sur sa boîte vocale. »"
  - id: listen-a2-au-telephone-et-a-la-poste.q2
    prompt: "Qu'envoie-t-elle à la poste ?"
    options:
      - "Une enveloppe et un colis"
      - "Seulement une enveloppe"
      - "Une signature"
    answer: "Une enveloppe et un colis"
    explain: "« J'envoie une enveloppe avec un timbre, et aussi un colis pour ma mère. »"
  - id: listen-a2-au-telephone-et-a-la-poste.q3
    prompt: "Qu'est-ce qu'il faut faire avant de partir ?"
    options:
      - "Une signature"
      - "Payer le timbre"
      - "Changer l'adresse"
    answer: "Une signature"
    explain: "« Il faut une signature ici. »"
