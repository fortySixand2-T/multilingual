id: listen-a2-a-la-banque
level: a2
skill: listening
title: "À la banque"
time_limit_seconds: 110
audio_ref: a2/audio/listen-a2-a-la-banque.mp3
accent: qc
allow_replay: true
pass_threshold: 0.6
script: |
  Bonjour, je voudrais ouvrir un compte bancaire. Très bien. Voici votre carte
  bancaire. Vous pouvez prendre de l'argent au distributeur ou venir au guichet. Je
  peux payer par chèque ? Oui, bien sûr. J'ai perdu mon portefeuille : il y avait une pièce de monnaie et mes papiers. Ce n'est pas grave, l'assurance va aider. Et si je veux
  emprunter de l'argent ? C'est possible, mais il faut économiser aussi, pas
  seulement dépenser. Le tarif est de cinq dollars par mois, plus la taxe. On ne
  devient pas riche vite, mais on n'est pas pauvre non plus.
questions:
  - id: listen-a2-a-la-banque.q1
    prompt: "Où peut-on prendre de l'argent ?"
    options:
      - "Au distributeur ou au guichet"
      - "Seulement au guichet"
      - "Avec un chèque"
    answer: "Au distributeur ou au guichet"
    explain: "« Vous pouvez prendre de l'argent au distributeur ou venir au guichet. »"
  - id: listen-a2-a-la-banque.q2
    prompt: "Qu'est-ce que le client a perdu ?"
    options:
      - "Son portefeuille"
      - "Sa carte bancaire"
      - "Son chèque"
    answer: "Son portefeuille"
    explain: "« J'ai perdu mon portefeuille : il y avait une pièce de monnaie et mes papiers. »"
  - id: listen-a2-a-la-banque.q3
    prompt: "Quel conseil donne l'employée ?"
    options:
      - "Il faut économiser, pas seulement dépenser"
      - "Il faut emprunter chaque mois"
      - "Il ne faut pas payer la taxe"
    answer: "Il faut économiser, pas seulement dépenser"
    explain: "« il faut économiser aussi, pas seulement dépenser »."
