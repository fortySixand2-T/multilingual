id: read-a2-a-velo-en-hiver
level: a2
skill: reading
title: "À vélo en hiver"
time_limit_seconds: 180
pass_threshold: 0.6
passage: |
  Mon fils Hugo va à l'école à vélo. Voici mes conseils. Pour traverser la grande rue,
  descends du vélo et marche. Il ne faut jamais lâcher le guidon avec les deux mains.
  En hiver, la piste cyclable peut être dangereuse : on peut glisser sur la glace. Il
  ne faut pas s'approcher de la route quand un camion passe. À l'école, tu peux enlever
  ton casque et le mettre dans ton sac.
questions:
  - id: read-a2-a-velo-en-hiver.q1
    prompt: "Que doit faire Hugo pour traverser la grande rue ?"
    options:
      - "Descendre du vélo et marcher"
      - "Rouler plus vite"
      - "Enlever son casque"
    answer: "Descendre du vélo et marcher"
    explain: "« Pour traverser la grande rue, descends du vélo et marche. »"
  - id: read-a2-a-velo-en-hiver.q2
    prompt: "Pourquoi la piste cyclable est-elle dangereuse en hiver ?"
    options:
      - "On peut glisser sur la glace"
      - "Il y a beaucoup de camions"
      - "Elle est fermée"
    answer: "On peut glisser sur la glace"
    explain: "« En hiver, la piste cyclable peut être dangereuse : on peut glisser sur la glace. »"
  - id: read-a2-a-velo-en-hiver.q3
    prompt: "Où Hugo peut-il enlever son casque ?"
    options:
      - "À l'école"
      - "Dans la rue"
      - "Sur la piste cyclable"
    answer: "À l'école"
    explain: "« À l'école, tu peux enlever ton casque et le mettre dans ton sac. »"
