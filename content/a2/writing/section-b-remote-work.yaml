id: write-a2-remote-work
level: a2
section: B
title: "Le télétravail"
min_words: 160
max_words: 260
prompt: |
  De plus en plus de personnes travaillent à la maison. Pensez-vous que c'est une
  bonne chose ? Donnez votre opinion et justifiez-la avec des exemples concrets de
  votre expérience ou de celle de vos proches.
target_vocab: [travail, bureau, collegue, ordinateur, reunion]
