section: B
title: "Les transports en commun"
min_words: 160
max_words: 260
prompt: |
  Dans certaines villes, on encourage les gens à prendre les transports en commun
  plutôt que la voiture. Pensez-vous que c'est une bonne idée ? Donnez votre opinion
