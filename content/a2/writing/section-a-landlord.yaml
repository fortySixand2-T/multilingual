id: write-a2-landlord
level: a2
section: A
title: "Un mot au propriétaire"
min_words: 60
max_words: 120
prompt: |
  Il y a un problème dans votre appartement (par exemple, le chauffage ne marche
  pas). Écrivez un mot à votre propriétaire : décrivez le problème, dites depuis
  quand, et demandez une réparation rapide.
target_vocab: [appartement, loyer, chambre, fenetre, cle]
