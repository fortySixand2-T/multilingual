id: cuisine-a2-03
title: "Cooking — review"
grammar_point: "recipe instructions"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [couper, eplucher, cuire, bouillir, poele, ingredient, saler, gouter]
pass_threshold: 8.0
exercises:
  - id: cuisine-a2-03.e1
    type: mcq
    prompt: "Pour faire un gâteau, je suis une ___."
    options: [recette, valise, réunion]
    answer: recette
    explain: "la recette = the recipe."

  - id: cuisine-a2-03.e2
    type: translate
    prompt: "Translate: “to cook”"
    answer: cuisiner

  - id: cuisine-a2-03.e3
    type: word_bank
    prompt: "Build: “I mix well.”"
    tokens: [Je, mélange, bien, ajoute]
    answer: [Je, mélange, bien]

  - id: cuisine-a2-03.e4
    type: match_pairs
    pairs:
      - [four, oven]
      - [ajouter, "to add"]
      - [mélanger, "to mix"]

  - id: cuisine-a2-03.e5
    type: mcq
    prompt: "« la recette » is a…"
    options: [recipe, plate, knife]
    answer: recipe
    explain: "la recette = the recipe."
  - id: cuisine-a2-03.e6
    type: match_pairs
    pairs:
      - ["cuire", "to cook / bake"]
      - ["bouillir", "to boil"]
      - ["poêle", "frying pan"]
      - ["ingrédient", "ingredient"]
      - ["goûter", "to taste"]

  - id: cuisine-a2-03.e7
    type: word_bank
    prompt: "Build: “Peel the potatoes and cut the onions.”"
    tokens: ["épluchez", les, pommes, de, terre, et, coupez, les, oignons, salez]
    answer: ["épluchez", les, pommes, de, terre, et, coupez, les, oignons]
