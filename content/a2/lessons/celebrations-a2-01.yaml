  - id: celebrations-a2-01.e4
    type: mcq
    prompt: "The Canadian autumn holiday is…"
    options: ["l'Action de grâce", "le jour de l'An", "Pâques"]
    answer: "l'Action de grâce"
    explain: "l'Action de grâce = Thanksgiving, in October in Canada."

  - id: celebrations-a2-01.e5
    type: mcq
    prompt: "« Je te ___ un joyeux anniversaire ! »"
    options: ["souhaite", "fête", "invite"]
    answer: "souhaite"
    explain: "souhaiter = to wish; fêter = to celebrate; inviter = to invite."

  - id: celebrations-a2-01.e6
    type: word_bank
    prompt: "Build: “I invite you to my party”"
    tokens: [Je, t'invite, à, ma, fête, cadeau]
    answer: [Je, t'invite, à, ma, fête]

  - id: celebrations-a2-01.e7
    type: translate
    prompt: "Translate: “a gift”"
    answer: "un cadeau"
    accept: [cadeau]

  - id: celebrations-a2-01.e8
    type: listen_type
    audio_ref: a2/audio/bapteme.mp3
