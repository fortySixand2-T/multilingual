id: sante-a2-04
title: "Symptoms & the pharmacy"
grammar_point: "avoir mal à + body part"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [gorge, estomac, poumon, cheville, poignet, grippe, migraine, vomir, tousser, eternuer, saigner, pansement, sirop, comprime, piqure, thermometre]
pass_threshold: 8.0
exercises:
  - id: sante-a2-04.e1
    type: match_pairs
    pairs:
      - [gorge, throat]
      - [estomac, stomach]
      - [poumon, lung]
      - [cheville, ankle]
      - [poignet, wrist]

  - id: sante-a2-04.e2
    type: match_pairs
    pairs:
      - [tousser, to cough]
      - [éternuer, to sneeze]
      - [vomir, to vomit]
      - [saigner, to bleed]
      - [grippe, flu]

  - id: sante-a2-04.e3
    type: match_pairs
    pairs:
      - [pansement, bandage]
      - [sirop, cough syrup]
      - [comprimé, tablet]
      - [piqûre, shot]
      - [thermomètre, thermometer]

  - id: sante-a2-04.e4
    type: mcq
    prompt: "« J'ai mal ___ gorge. »"
    options: ["à la", "au", "aux"]
    answer: "à la"
    explain: "avoir mal à + la gorge (feminine). Compare: j'ai mal au dos, j'ai mal aux dents."

  - id: sante-a2-04.e5
    type: mcq
    prompt: "You have a bad headache. You have « une ___ »."
    options: ["migraine", "grippe", "piqûre"]
    answer: "migraine"
    explain: "une migraine = a migraine/bad headache."

  - id: sante-a2-04.e6
    type: word_bank
    prompt: "Build: “I have a sore throat”"
    tokens: [J'ai, mal, à, la, gorge, au]
    answer: [J'ai, mal, à, la, gorge]

  - id: sante-a2-04.e7
    type: translate
    prompt: "Translate: “to cough”"
    answer: tousser

  - id: sante-a2-04.e8
    type: listen_type
    audio_ref: a2/audio/thermometre.mp3
    answer: thermomètre
    prompt: "Type the word you hear."
