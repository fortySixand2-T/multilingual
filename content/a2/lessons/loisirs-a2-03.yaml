id: loisirs-a2-03
title: "Free time — review"
grammar_point: "« jouer / faire »"
grammar_category: "Expressions & communication"
est_minutes: 8
new_vocab: [peindre, dessiner, voyager, jardiner, photographie, jeu, equipe, concert]
pass_threshold: 8.0
exercises:
  - id: loisirs-a2-03.e1
    type: mcq
    prompt: "« Le week-end, je ___ au foot. »"
    options: [joue, jouer, jeu]
    answer: joue
    explain: "je joue = I play."

  - id: loisirs-a2-03.e2
    type: translate
    prompt: "Translate: “a book”"
    answer: "un livre"
    accept: [livre]

  - id: loisirs-a2-03.e3
    type: word_bank
    prompt: "Build: “I take a walk.”"
    tokens: [Je, fais, une, promenade, sport]
    answer: [Je, fais, une, promenade]

  - id: loisirs-a2-03.e4
    type: match_pairs
    pairs:
      - [sport, sport]
      - [livre, book]
      - [loisir, "leisure activity"]

  - id: loisirs-a2-03.e5
    type: mcq
    prompt: "« nager » means…"
    options: ["to swim", "to sing", "to play"]
    answer: "to swim"
    explain: "nager = to swim."
  - id: loisirs-a2-03.e6
    type: match_pairs
    pairs:
      - ["voyager", "to travel"]
      - ["photographie", "photography"]
      - ["équipe", "team"]
      - ["concert", "concert"]

  - id: loisirs-a2-03.e7
    type: mcq
    prompt: "« Le week-end, j'aime ___ dans le jardin. »"
    options: ["jardiner", "peindre", "dessiner"]
    answer: "jardiner"
    explain: "« faire du jardinage » ou « jardiner » ; peindre et dessiner sont des arts."
