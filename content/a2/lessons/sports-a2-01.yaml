  - id: sports-a2-01.e4
    type: mcq
    prompt: "In Québec, the game played with a round ball and goals is…"
    options: ["le soccer", "le football", "le hockey"]
    answer: "le soccer"
    explain: "In Québec le soccer = soccer; le football means American/Canadian football."

  - id: sports-a2-01.e5
    type: mcq
    prompt: "« Je ___ au tennis. »"
    options: ["joue", "fais", "vais"]
    answer: "joue"
    explain: "jouer à + sport with a ball: je joue au tennis. But: je fais de la natation."

  - id: sports-a2-01.e6
    type: word_bank
    prompt: "Build: “I do gymnastics”"
    tokens: [Je, fais, de, la, gymnastique, joue]
    answer: [Je, fais, de, la, gymnastique]

  - id: sports-a2-01.e7
    type: translate
    prompt: "Translate: “to lose”"
    answer: perdre

